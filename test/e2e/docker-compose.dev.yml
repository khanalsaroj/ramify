# E2E harness for Ramify's MVP definition of done (build spec §7 item 3 / §8 step 15).
#
# Brings up: CoreDNS serving a file-backed zone (standing in for a real DNS
# provider — see test/e2e/dnsfile and DECISIONS.md for why), Pebble as a local ACME
# server issuing certificates via DNS-01 against CoreDNS, a fake SSH deploy target
# exercising the real SSH transport in providers/deploy/compose, a mock GitHub REST
# API recording PR comments, and a test-runner that drives the full
# create -> verify -> destroy loop using Ramify's real provider implementations and
# reconciler.
#
# Run with:
#   docker compose -f test/e2e/docker-compose.dev.yml run --build --rm test-runner
#   docker compose -f test/e2e/docker-compose.dev.yml down --volumes
#
# `run` (not `up`) is deliberate: it starts the dependencies, waits for the
# depends_on conditions, and exits with the test's own status. `up
# --abort-on-container-exit` cannot work here because zones-init is a one-shot
# container — it completes within a second of start and would abort the stack
# before the test-runner had done anything.

services:
  coredns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/Corefile"]
    volumes:
      - ./coredns/Corefile:/Corefile:ro
      - zones-data:/zones
    # The file plugin fails at startup if its zone file is missing, so CoreDNS must
    # not race zones-init for it.
    depends_on:
      zones-init:
        condition: service_completed_successfully
    networks: [ramify-e2e]

  zones-init:
    image: busybox:1.36
    volumes:
      - zones-data:/zones
      - ./coredns/zones:/seed:ro
    entrypoint: ["/bin/sh", "-c", "cp /seed/*.zone /zones/ && echo seeded"]
    networks: [ramify-e2e]

  # Pebble is published to GitHub's registry, not Docker Hub, and its image is
  # built FROM scratch: the entrypoint is the binary itself (/app), so the command
  # here is Pebble's arguments only — no leading "pebble".
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "coredns:53"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    depends_on:
      coredns:
        condition: service_started
    networks: [ramify-e2e]

  mockgithub:
    build:
      context: ../..
      dockerfile: test/e2e/images/mockgithub/Dockerfile
    networks: [ramify-e2e]

  sshd:
    build:
      context: images/sshd
    volumes:
      - sshd-key:/shared
    networks: [ramify-e2e]

  test-runner:
    build:
      context: ../..
      dockerfile: test/e2e/images/testrunner/Dockerfile
    depends_on:
      coredns:
        condition: service_started
      pebble:
        condition: service_started
      mockgithub:
        condition: service_started
      sshd:
        condition: service_started
    volumes:
      - zones-data:/zones
      - sshd-key:/ssh:ro
    environment:
      RAMIFY_E2E_ZONE_FILE: /zones/preview.example.com.zone
      RAMIFY_E2E_ZONE: preview.example.com
      RAMIFY_E2E_PEBBLE_DIR_URL: https://pebble:14000/dir
      # Pebble's self-signed test root, copied out of the Pebble image at build
      # time (see the test-runner Dockerfile) — it has no shell to copy it itself.
      RAMIFY_E2E_PEBBLE_CA_CERT: /shared/pebble.minica.pem
      RAMIFY_E2E_GITHUB_BASE_URL: http://mockgithub:8080/
      RAMIFY_E2E_SSH_ADDR: sshd:22
      RAMIFY_E2E_SSH_USER: root
      RAMIFY_E2E_SSH_KEY_PATH: /ssh/id_ed25519
      RAMIFY_E2E_SSH_READY_PATH: /ssh/ready
      RAMIFY_E2E_WEBHOOK_SECRET: e2e-test-webhook-secret
      RAMIFY_E2E_ARTIFACT_REF: busybox:1.36
    networks: [ramify-e2e]

networks:
  ramify-e2e: {}

volumes:
  zones-data: {}
  sshd-key: {}

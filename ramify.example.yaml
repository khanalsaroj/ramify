# Example ramify.yaml — copy to ramify.yaml and fill in the values for your setup.
# Fields ending in a secret (tokens, webhook secrets) accept either a literal value
# or a "$NAME" / "${NAME}" reference resolved from the environment at startup, so
# the literal secret never has to live in this file. Ramify logs which fields were
# configured, never their values.

# The DNS zone/suffix preview environments are published under, e.g. a branch
# "feature-x" is published at "feature-x.preview.example.com".
base_domain: preview.example.com

server:
  # Unix socket the control API listens on by default.
  socket_path: /var/run/ramify/ramify.sock
  # Optional token-protected TCP listener, for remote CLI access. Leave both empty
  # to disable and use the unix socket only.
  tcp_addr: ""
  tcp_token: ""

store:
  path: /var/lib/ramify/ramify.db

reaper:
  # How often the reaper checks for expired environments.
  interval: 5m
  # TTL applied to a new environment unless overridden per-environment.
  default_ttl: 72h
  event_retention: 720h

git:
  # Supported values: github, gitlab, bitbucket.
  provider: github
  # Token used to post status comments.
  token: $RAMIFY_GITHUB_TOKEN
  # The webhook secret configured on the repository webhook.
  webhook_secret: $RAMIFY_GITHUB_WEBHOOK_SECRET
  # Set this for self-hosted GitLab (for example https://gitlab.example.com).
  # GitHub and Bitbucket Cloud use their public defaults when omitted.
  base_url: ""

deploy:
  # Supported values: compose or kubernetes.
  provider: compose
  # The host Ramify SSHes to in order to run `docker compose`.
  ssh_addr: deploy-host.example.com:22
  ssh_user: ramify
  ssh_private_key_path: /etc/ramify/deploy_key
  # Path to the docker-compose.yml on the deploy host, run with
  # IMAGE_TAG=<artifact ref> and COMPOSE_PROJECT_NAME=<per-environment name>.
  compose_file: /srv/ramify/docker-compose.yml
  # Address DNS records should point to. Usually deploy_host's own address; a
  # reverse proxy on that host is expected to route by Host header to the right
  # compose service.
  dns_target: 203.0.113.10
  # Optional remote directory mounted/read by the reverse proxy for TLS files.
  certificate_dir: /srv/ramify/certificates
  # Kubernetes options (used when provider is kubernetes).
  kubernetes_namespace: ramify
  kubernetes_context: ""
  kubernetes_kubeconfig: ""
  kubernetes_ingress_class: nginx
  kubernetes_container_port: 8080
  kubernetes_service_port: 8080

dns:
  # Supported values: cloudflare, route53, googlecloud, digitalocean.
  provider: cloudflare
  zone: preview.example.com
  cloudflare_api_token: $RAMIFY_CLOUDFLARE_API_TOKEN
  # For DigitalOcean use api_token. For Google Cloud use project + zone_id
  # and Application Default Credentials. Route 53 uses the AWS credential chain.
  api_token: ""
  project: ""
  zone_id: ""

acme:
  email: ops@example.com
  storage_dir: /var/lib/ramify/certificates
  # Let's Encrypt production directory. Use
  # https://acme-staging-v02.api.letsencrypt.org/directory while testing to avoid
  # production rate limits.
  ca_dir_url: https://acme-v02.api.letsencrypt.org/directory

notify:
  # Optional Go text/template overrides per notification kind
  # (ready|updated|failed|expiring|destroyed), executed against a
  # providerapi.NotifyEvent ({{.Kind}}, {{.URL}}, {{.Detail}}). Any kind left out
  # here uses Ramify's built-in default template.
  comment_templates: {}

log:
  # "json" or "text". Leave empty to auto-detect (text on a TTY, json otherwise),
  # or set the RAMIFY_LOG_FORMAT environment variable.
  format: ""

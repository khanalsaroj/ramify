# Example ramify.yaml — copy to ramify.yaml and fill in the values for your setup.
# Fields ending in a secret (tokens, webhook secrets) accept either a literal value
# or a "$NAME" / "${NAME}" reference resolved from the environment at startup, so
# the literal secret never has to live in this file. Ramify logs which fields were
# configured, never their values.

# The DNS zone/suffix preview environments are published under, e.g. a branch
# "feature-x" is published at "feature-x.preview.example.com".
base_domain: preview.example.com

server:
  # Unix socket the control API listens on by default.
  socket_path: /var/run/ramify/ramify.sock
  # Optional token-protected TCP listener, for remote CLI access, and the address
  # the built-in dashboard is served on at /dashboard/. Leave both empty to
  # disable and use the unix socket only. Note the dashboard page itself is served
  # unauthenticated (a browser cannot send a bearer token on a navigation), so put
  # this listener on a trusted network; every environment route still requires the
  # token below.
  tcp_addr: ""
  tcp_token: ""
  # If tcp_addr is set to anything other than a loopback address (127.0.0.1,
  # ::1, localhost), Ramify requires either TLS (the two fields below) or the
  # explicit override further down — otherwise the bearer token and every
  # environment API response would be sent in the clear.
  tcp_tls_cert_file: ""
  tcp_tls_key_file: ""
  # Explicit, clearly-named opt-out: binds a non-loopback tcp_addr without TLS.
  # Only ever appropriate when a trusted reverse proxy in front of Ramify is
  # already terminating TLS.
  tcp_insecure_allow_remote: false

store:
  path: /var/lib/ramify/ramify.db

reaper:
  # How often the reaper checks for expired environments.
  interval: 5m
  # TTL applied to a new environment unless overridden per-environment.
  default_ttl: 72h
  event_retention: 720h
  # How many due durable events (webhook/apply/destroy) are processed at once.
  # Events for the same project/branch always run one at a time regardless of
  # this value; it only bounds how much cross-branch work runs concurrently.
  event_concurrency: 8

git:
  # Supported values: github, gitlab, bitbucket.
  provider: github
  # Token used to post status comments.
  token: $RAMIFY_GITHUB_TOKEN
  # The webhook secret configured on the repository webhook.
  webhook_secret: $RAMIFY_GITHUB_WEBHOOK_SECRET
  # Set this for self-hosted GitLab (for example https://gitlab.example.com).
  # GitHub and Bitbucket Cloud use their public defaults when omitted.
  base_url: ""

deploy:
  # Supported values: compose or kubernetes.
  provider: compose
  # The host Ramify SSHes to in order to run `docker compose`.
  ssh_addr: deploy-host.example.com:22
  ssh_user: ramify
  ssh_private_key_path: /etc/ramify/deploy_key
  # Verifies the deploy host's SSH key against an OpenSSH-format known_hosts
  # file. Required unless ssh_insecure_skip_host_key_verify is explicitly set
  # below: without either, Ramify would connect to whatever host answers on
  # ssh_addr with no way to detect impersonation. Generate one with
  # `ssh-keyscan -H deploy-host.example.com >> known_hosts`, after verifying
  # the fingerprint out of band.
  ssh_known_hosts_path: /etc/ramify/known_hosts
  # Explicit, clearly-named opt-out for ssh_known_hosts_path. Only ever safe
  # for a throwaway/local test host.
  ssh_insecure_skip_host_key_verify: false
  # How long Apply waits for the deploy provider's health check to report
  # healthy before treating the attempt as failed (it then retries with
  # Ramify's normal backoff). Leave both at zero to use the built-in defaults
  # (2m timeout, 2s poll interval).
  readiness_timeout: 0
  readiness_poll_interval: 0
  # Path to the docker-compose.yml on the deploy host, run with
  # IMAGE_TAG=<artifact ref> and COMPOSE_PROJECT_NAME=<per-environment name>.
  compose_file: /srv/ramify/docker-compose.yml
  # Address DNS records should point to. Usually deploy_host's own address; a
  # reverse proxy on that host is expected to route by Host header to the right
  # compose service.
  dns_target: 203.0.113.10
  # Remote directory TLS material is installed into, mounted/read by your
  # reverse proxy. Required when provider is compose: SSH is the only route a
  # certificate has to that host. Unused by kubernetes, which installs
  # certificates as Secrets instead.
  certificate_dir: /srv/ramify/certificates
  # Kubernetes options (used when provider is kubernetes).
  kubernetes_namespace: ramify
  kubernetes_context: ""
  kubernetes_kubeconfig: ""
  kubernetes_ingress_class: nginx
  kubernetes_container_port: 8080
  kubernetes_service_port: 8080

dns:
  # Supported values: cloudflare, route53, googlecloud, digitalocean.
  provider: cloudflare
  zone: preview.example.com
  cloudflare_api_token: $RAMIFY_CLOUDFLARE_API_TOKEN
  # For DigitalOcean use api_token. For Google Cloud use project + zone_id
  # and Application Default Credentials. Route 53 uses the AWS credential chain.
  api_token: ""
  project: ""
  zone_id: ""

filter:
  # Which webhook events are allowed to create an environment. Recommended
  # starting point below is pr_only plus a finite max_concurrent_envs, so a
  # fresh install doesn't spin up a preview (and spend provider/DNS/ACME
  # resources) for every branch push, including throwaway and bot branches. Set
  # pr_only: false and max_concurrent_envs: 0 to restore the original
  # deploy-everything, unlimited behavior.
  #
  # Only deploy branches that have an open pull/merge request.
  pr_only: true
  # Branch glob patterns, following the same convention as GitHub Actions branch
  # filters: "*" does not cross a slash, "**" does. So "dependabot/*" does NOT
  # match "dependabot/npm/lodash" -- use "dependabot/**" for that.
  # deny_branches is evaluated first and wins, so a narrow exclusion can be
  # carved out of a broad allow. An empty allow_branches allows everything that
  # deny_branches does not reject.
  allow_branches: []
  deny_branches: []
  # Deploy a pull request only if it carries at least one of these labels,
  # matched case insensitively. Skipped where the host cannot report labels:
  # Bitbucket Cloud has no pull request labels, and a bare branch push has no
  # request to carry them. Set pr_only alongside this to make the gate absolute.
  required_labels: []
  # Ceiling on live environments (every status except destroyed). At the ceiling
  # a push for a NEW environment is skipped and logged; pushes to environments
  # that already exist still deploy, so nothing already live goes stale. Nothing
  # is ever evicted to make room. 0 means unlimited.
  max_concurrent_envs: 10

acme:
  email: ops@example.com
  storage_dir: /var/lib/ramify/certificates
  # Let's Encrypt production directory. Use
  # https://acme-staging-v02.api.letsencrypt.org/directory while testing to avoid
  # production rate limits.
  ca_dir_url: https://acme-v02.api.letsencrypt.org/directory

notify:
  # Optional Go text/template overrides per notification kind
  # (ready|updated|failed|expiring|destroyed), executed against a
  # providerapi.NotifyEvent ({{.Kind}}, {{.URL}}, {{.Detail}}). Any kind left out
  # here uses Ramify's built-in default template.
  comment_templates: {}

log:
  # "json" or "text". Leave empty to auto-detect (text on a TTY, json otherwise),
  # or set the RAMIFY_LOG_FORMAT environment variable.
  format: ""
